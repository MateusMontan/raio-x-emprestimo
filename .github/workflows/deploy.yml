name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrations e publicação
    needs: verify
    # Disparo manual só publica a partir da main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    # Deploys em fila, nunca cancelados no meio.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build da web
        run: pnpm --filter @raiox/web build

      # Migrations antes do deploy: o código novo espera o schema novo.
      - name: Aplicar migrations do D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Secrets ausentes::Crie CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions (repository secrets)."
            exit 1
          fi
          bash .github/scripts/run-and-annotate.sh "Migrations do D1" \
            pnpm --filter @raiox/api exec wrangler d1 migrations apply raiox-db --remote

      - name: Publicar Worker
        id: publish
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash .github/scripts/run-and-annotate.sh "Publicação do Worker" \
            pnpm --filter @raiox/api exec wrangler deploy | tee deploy.log
          # || true: sem casamento o grep sai com 1, tratado logo abaixo.
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | sed -n '1p' || true)"
          if [ -z "$URL" ]; then
            echo "::error::URL do Worker não encontrada na saída do wrangler deploy." >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        shell: bash
        env:
          APP_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "$APP_URL/api/health"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "$APP_URL/" > /dev/null
          # Passa pelo D1: um id bem formado e inexistente precisa responder 404, não 500.
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 5 "$APP_URL/api/v1/simulations/zzzzzzzzzz")"
          if [ "$STATUS" != "404" ]; then
            echo "::error title=Smoke test::GET /api/v1/simulations/zzzzzzzzzz respondeu $STATUS; o esperado é 404 (leitura no D1)."
            exit 1
          fi
